[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "py-tetris"
version = "1.11.0"
description = "A Tetris clone built with pygame"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.1,<3",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.11,<7",
    "pytest>=8.3,<9",
]

[project.scripts]
py-tetris = "game.app:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "game",
    "game_assets",
    "high_score.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
